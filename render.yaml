services:
  # ── FastAPI Backend ──────────────────────────────────────
  - type: web
    name: duolingo-backend
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: chmod +x render_build.sh && ./render_build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.4"
    plan: free

  # ── Next.js Frontend ─────────────────────────────────────
  - type: web
    name: duolingo-frontend
    runtime: node
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "18.17.0"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: duolingo-backend
          type: web
          property: host
          # Render will auto-resolve this to the backend's URL
    plan: free
